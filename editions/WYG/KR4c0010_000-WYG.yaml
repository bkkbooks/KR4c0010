  - {type: page-break, offset: 0, content: '', id: KR4c0010_WYG_000-1a, image: WYG1066/WYG1066-0001a.png}
body:
  text: 李北海集别集類一唐提要臣等謹案李北海集六巻唐李邕傳邕事迹具唐事本傳邕文集本七十巻宋志亦不著録此本為明無錫曹銓所刋前有荃序稱紹和徵君刻唐人集初得北海集而餘論之不言為何人所編大抵皆採摭文苑英華諸書裒而成帙非原本矣史稱邕長于碑頌前後所製凡數百首今惟賦五首詩四首表十四首疏狀各一首碑文八首銘記各一首神道碑五首墓記銘一首葢已十不存一舊唐書稱其韓公行状洪州放生池碑批韋巨源諡議為當時文士所重李白東海有勇婦一篇稱北海李使君飛章奏天庭杜甫八哀詩稱朗詠六公篇憂来豁䝉蔽趙明誠金石録稱稱唐六公詠文詞髙古今皆不見此集中殊可惜也劉克莊後村詩話譏其為葉法善祖作碑貽千載之笑然唐時名儒碩士為緇黄秉筆不以為嫌不似兩宋諸儒視二教如敵國此當尚論其世固不容執後而議前且克莊與真徳秀㳺徳秀西山集中琳宫梵刹之文不可枚舉克壯曾無一詞而獨刻責扵邕是尤門户之見不足服邕之心矣巻末附録載新舊唐書邕本傳及贈送諸作而别載文苑英華所録邕賀赦表六篇題曰糾謬謂考其事在代宗徳宗憲宗時邕不及見其論次頗為精審然考彭叔夏文苑英華辨證曰賀赦表六首類表以為李吉甫作而文苑以為李邕案邕天寳初卒而六表乃在代宗憲宗時况文苑於三百五十九巻重出一表題曰李吉甫又第二表末云謹遣衙前虞候王國清奉表陳賀以聞正與吉甫郴州謝上表末語同則非邕作也云云是宋人巳經考正編是集者用其説而諱所自来亦可謂攘人之善矣乾隆四十一年七月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書集部二李北海集目錄别集類一唐巻一賦日賦春賦石賦鬬雞賦鶻賦高適和鶻賦附并序詩銅雀妓詠雲登歴下古城員外孫新亭亭對鵲河時李之芳自尚書郎出為齊州製此亭杜甫同李太守登歴下古城孫員外新亭附奉和初春幸太平公主南莊應制韋嗣立和初春幸太平公主南莊附李嶠和初春幸太平公主南莊附李乂和初春幸太平公主南莊附宋之問和初春幸太平公主南莊附沈佺期和初春幸太平公主南莊附邵昇和初春幸太平公主南莊附蘓頲和初春幸太平公主南莊附巻二表賀加天寶尊號表賀感夣聖祖表賀新殿鐘鳴表賀章仇兼瓊克㨗表淄州刺史謝上表為濠州刺史王弼謝上表謝賜遊曲江宴表謝入朝表謝書上考表謝勅書及綵綾表二首謝賜慰喻表辭官歸滑州表進喜雪詩表進文馬表疏諫鄭普思以方技得幸疏狀謝恩命遣高將軍出餞疏巻三碑兖州曲阜縣孔子廟碑嵩岳寺碑五臺山清涼寺碑泗州臨淮縣普光王寺碑巻四碑大相國寺碑大雲寺禪院碑鄭州大雲寺碑楚州淮陰縣婆羅樹碑銘越州蕐嚴寺鐘銘并序記石室記巻五神道碑唐贈太子少保劉知柔神道碑左羽林大將軍臧公神道碑巻六神道碑贈安州都督王仁忠神道碑長安縣尉贈隴州刺史王府君神道碑桂州長史程府君神道碑墓誌銘羽林大將軍臧公墓誌銘附錄李邕傳石晉劉昫李邕傳宋宋祁送李邕之任滑臺唐𤣥宗同李太守北池泛舟宴髙平鄭太守唐髙適同羣公十月朝宴李太守宅唐髙適陪李北海宴歴下亭唐杜甫八哀詩秘書監江夏李公邕唐杜甫送李邕唐李嶠遺事集評糾謬賀赦表六首李北海集序紹和徴君刻唐人集未竟而余就其家索其遺書尚存數十種將竝梓以傳力亦未之逮也初得李北海集而余論定之為之嚆矢北海豪於文者也終始見嫉於時相卒以讒死世論惜之然遇崔湜而不竄遇林甫而不死亦豈得為北海哉而余獨惜姚張猶稱才相乃亦不能容北海豈非子美所稱獨步四十年階之為厲然則北海非死於讒盖死於文也然北海自以直節見重當世屢貶竄而名益彰故當世重其文若此不獨以文也傳稱邕有集七十巻而今所存僅六巻曩時所為炤四裔唳九皋者其為湮沒可勝道哉大略邕負氣似長沙好客似信陵豪侈放縱不拘細行似冦萊公而其志大才踈實與文舉相類卒之一死於操一死於林甫先後兩北海若合符節豈不異哉讀孔璋二善之書妻温戍邊之請吾猶為之流涕崇禎庚辰桂月梁谿曹荃題
