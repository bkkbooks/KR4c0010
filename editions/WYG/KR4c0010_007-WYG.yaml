body:
  text: 附録李邕傳石晉劉昫李邕廣陵江都人父善嘗受文選於同郡人曹憲後為左侍極賀蘭敏之所薦引為崇賢館學士轉蘭臺郎敏之敗善坐配流嶺外㑹赦還因寓居汴鄭之間以講文選為業年老疾卒所注文選六十巻大行於時邕少知名長安初内史李嶠及監察御史張廷珪並薦邕詞髙行直堪為諫諍之官繇是召拜左拾遺俄而御史中丞宋璟奏侍臣張昌宗兄弟有不順之言請付法推斷則天初不應邕在階下進曰臣觀宋璟之言事闗社稷望陛下可其奏則天色稍解始允宋璟所請既出或謂邕曰吾子名位尚卑若不稱㫖禍將不測何為造次如是邕曰不愿不狂其名不彰若不如此後代何以稱也及中宗即位以妖人鄭普思為秘書監邕上書諌不納以與張柬之善出為南和令又貶富州司户唐建隆元年𤣥宗清内難召拜左臺殿中侍御史改户部員外郎又貶崖州舎城丞開元三年擢為户部郎中邕素與黄門侍郎張廷珪友善時姜皎用事與廷珪謀引邕為憲官事洩中書令姚崇嫉邕險躁因而搆成其罪左遷括州司馬後徵為陳州刺史十三年𤣥宗車駕東封迴邕於汴州謁見累獻詞賦甚稱上㫖繇是頗自矜􅃷自云當居相位張説為中書令甚惡之俄而陳州贓汙事發下獄鞫訊罪當死許州人孔璋上書救邕曰臣聞明主御㝢捨過舉能取材棄行烈士抗節勇不避死見危授命晉用林父豈念過乎漢用陳平豈念行乎禽息殞身豈愛死乎向若林父誅陳平死百里不用晏嬰見逐是晉無赤狄之土漢無皇極之尊秦不并西戎齊不覇東海矣臣伏見陳州刺史李邕學成師範文堪經國剛毅忠烈難不茍免往者張易之用權人畏其口而邕折其角韋氏恃勢言出禍應而邕挫其鋒雖身受屈終奸謀中損即邕有大造於我邦家也且斯人所能者拯孤恤窮救乏賑患積而便散家無私聚今聞坐贓下吏鞫訊待報將至極刑死在朝夕臣聞生無益於國不若殺身以明賢臣朽賤庸夫輪轅無取獸息禽視雖生何為况賢為國寶社稷之衛是臣痛惜深矣臣願六尺之軀甘受膏斧以代邕死臣之死所謂落一毛邕之生有足照千里然臣與邕生平不欵臣知有邕邕不知有臣臣不逮邕明矣夫知賢而舉仁也代人任患義也臣獲二善而死且不朽則又何求陛下若以臣之賤不足以贖邕鴈門縫掖有効矣伏惟陛下寛邕之生速臣之罪令邕率徳改行想林父之功使臣得瞑目黄泉附北郭之迹臣之大願畢矣陛下即以陽和之始難於用鉞俟天成命敢忘伏劍豈煩大刑然後歸死皇天后土實照臣之心昔吳楚七國叛因亞夫得劇孟則冦不足憂夫以一賢之能敵七國之衆伏惟敷􅍭垢之道存棄瑕之義逺思劇孟近取李邕豈惟成愷悌之澤實亦歸天下之望况大禮之後天地更新赦而復論人誰無罪惟明主圗之臣聞士為知巳者死且臣不為死者所知甘於死者豈獨為惜邕之賢亦成陛下矜能之徳惟明主圗之疏奏邕以㑹減死貶為欽州遵化縣尉璋亦配流嶺南而死邕後於嶺南從中官揚思朂討賊有功又累轉括淄滑三州刺史上計京師邕素負美名頻被貶斥皆以邕能文養士賈生信陵之流執事忌勝剥落在外人間素有聲稱後進不識京落阡陌聚觀以為古人或將眉目有異衣冠望風尋訪門巷又中使臨問索其新文復為人陰中竟不得進天寶初為汲郡北海二太守邕性豪侈不拘細行所在縱求財貨馳獵自恣五載奸贓事發又嘗與左驍衛兵曹栁勣馬一匹及勣下獄吉温令勣引邕議及休咎厚相賂遺詞狀連引勅刑部員外郎祁順之監察御史羅希奭馳往就郡决殺之時年七十餘初邕早擅才名尤長碑頌雖貶職在外中朝衣冠及天下寺觀多齎持金帛往求其文前後所製凡數百首受納饋遺亦至鉅萬時議以為自古鬻文獲財未有如邕者有文集七十巻其韓公行狀洪州放生池碑批韋巨源諡議文士推重之後因恩例得贈秘書監李邕傳宋祁李邕字泰和揚州江都人父善有雅行淹貫古今不能屬辭故人號書簏顯慶中累擢崇賢館直學士兼沛王侍讀為文選注敷析淵洽表上之賜賚頗渥除潞王府記室㕘軍為涇城令坐與賀蘭敏之善流姚州遇赦還居沛鄭間講授諸生四逺至傳其業號文選學邕少知名始善注文選釋事而忘意書成以問邕邕不敢對善詰之邕意欲有所更善曰試為我補益之邕附事見義善以其不可奪故兩書並行既冠見特進李嶠自言讀書未徧願一見秘書嶠曰祕閣萬巻豈時日能習邪邕固請乃假直祕書未幾辭去嶠驚試問奥篇隠帙了辯如響嶠歎曰子且名家嶠為内史與監察御史張廷珪薦邕文髙氣方直才任諫諍乃召拜左拾遺御史中丞宋璟劾張昌宗等反狀武后不應邕立階下大言曰璟所陳社稷大計陛下當聽后色解即可璟奏邕出或讓曰子位卑一忤㫖禍不測邕曰不如是名亦不傳中宗立鄭普思以方技幸擢祕書監邕諫不納五王誅坐善張柬之出為南和令貶富州司户㕘軍事韋氏平召拜左臺殿中侍御史彈劾任職人頗憚之譙王重福謀反邕與洛州司馬崔日知捕支黨遷户部員外郎岑羲崔湜惡日知而邕與之交𤣥宗在東宫邕及崔隠甫倪若水同被禮遇羲等忌之貶邕舎城丞𤣥宗即位召為户部郎中張廷珪為黄門侍郎而姜皎方幸共援邕為御史中丞姚崇疾邕險躁左遷括州司馬起為陳州刺史帝封泰山還邕見帝汴州詔獻辭賦帝悦然矜肆自謂宜宰相邕素輕張説與相惡㑹仇人告邕贓貸枉法下獄當死許昌男子孔璋上書天子曰明主舉能而捨過取才而棄行烈士抗節勇者不避死故晉用林父不以過漢任陳平不以行禽息殞身不祈生北郭碎首不愛死向若林父誅陳平死百里不用晏嬰見逐是晉無赤狄之土漢無天子之尊秦不彊齊不霸矣伏見陳州刺史邕剛毅忠烈難不茍免往者折二張之角挫韋氏之鋒雖身受謫屈而奸謀沮解即邕有功於國且邕所能者拯孤恤窮救乏明惠家無私聚今聞坐贓下吏死在旦夕臣聞生無益於國者不若殺身以明賢臣願以六尺之軀膏鐵鉞以代邕死臣與邕生平不欵曲臣知有邕邕不知有臣臣不逮邕明矣夫知賢而舉仁也任人之惠義也獲二善以死臣又何求伏惟陛下寛邕之死使率徳改行興林父曲逆之功臣待瞑目附禽息北郭之迹大願畢矣若以陽和方始重行大戮則臣請伏劍不敢煩有司皇天后土實聞臣言昔吳楚反漢得劇孟則不憂夫以一賢而敵七國之衆伏惟敷含垢之道棄瑕之義逺思劇孟近取於邕況告成岱宗天地更新赦而復論人孰無罪惟明王圖之臣聞士為知已者死臣不為死者所知而甘之死者非特惜邕賢亦以成陛下矜能之慈疏奏邕得減死貶遵化尉流璋嶺南邕妻温復為邕請戍邊自贖曰邕少習文章疾惡如讎不容於衆邪妄切齒諸儒側目頻謫逺郡削跡朝端不啻十載嵗時歎戀聞者傷懐屬國家有事㤗山法駕旋路邕獻牛酒例䝉恩私妾聞正人用則佞人憂邕之禍端故自此始且邕比任外官卒無一毁天意暫顧罪過旋生諺曰士無賢不肖入朝見疾惟陛下明察邕初䝉訊責便繫牢户水不入口者踰五日氣息奄奄惟吏是聽事生吏日迫邕手書貸人蠶種以為枉法市羅貢奉指為奸贓于時匭使朝堂守捉嚴固號天訴地誰肯為聞泣血去國投骨荒裔永無還期妾願使邕得充一卒効力王事膏塗朔邊骨糞沙壤成邕夙心表入不省邕後從中人楊思勗討嶺南賊有功徙灃州司馬開元二十三年起為括州刺史喜興利除害復坐誣枉且得罪天子識其名詔勿勘後歴淄滑二州刺史上計京師始邕蚤有名重義愛士久斥外不與士大夫接既入朝人間傳其眉目瓌異至阡陌聚觀後生望風内謁門巷填隘中人臨問索所為文章且進上以讒媢不得留出為汲郡北海太守天寶中左驍衞兵曹㕘軍栁勣有罪下獄邕嘗遺勣馬故吉温使引邕嘗以休咎相語陰賂遺宰相李林甫素忌邕因傅以罪詔刑部員外郎祁順之監察御史羅希奭就郡杖殺之時年七十代宗時贈祕書監邕之文於碑頌是所長人奉金帛請其文前後所受鉅萬計邕雖詘不進而文名天下時稱李北海盧藏用嘗謂邕如干將莫邪難與爭鋒但虞傷􅆙耳後卒如言杜甫知邕負謗死作八哀詩讀者傷之邕資豪放不能治細行所在賄謝畋游自肆終以敗云送李邕之任滑臺唐𤣥宗漢家重東郡宛彼白馬津黎庶既蕃殖臨之勞近臣逺别初首路今行方及春課成應第一良牧爾當仁同李太守北池泛舟宴髙平鄭太守唐髙適每揖龔黄事還陪李郭舟雲從四岳起水向百城流幽意隨登陟嘉言即獻酬乃知縫掖貴今日對諸侯同群公十月朝宴李太守宅唐髙適良牧徵髙賞褰帷問考槃嵗時當正月甲子入初寒已聽甘棠頌欣陪㫖酒歡仍憐門下客不作布衣㸔陪李北海宴歴下亭唐杜甫東籓駐皁葢北渚凌清河海右此亭古濟南名士多雲山巳發興玉珮仍當歌修竹不受暑交流空湧波藴真愜所遇落日將如何貴賤俱物役從公難重過八哀詩秘書監江夏李公邕唐杜甫長嘯宇宙間髙才日陵替古人不可見前輩復誰繼憶昔李公存詞林有根柢聲華當健筆灑落富清製風流散金石追琢山嶽鋭情窮造化理學貫天人際干謁走其門碑版照四裔各滿深望還森然起凡例蕭蕭白楊路洞徹寶珠惠龍宮塔廟湧浩劫浮雲衞宗儒俎豆事故吏去思計眄睞已皆虛跋渉曽不泥向來映當時豈特一作獨勸後世豐屋珊瑚鈎麒麟織成罽紫騮隨劍几義取無虛嵗分宅脱􅆖間感激懐未濟衆歸賙給美擺落多藏穢獨歩四十年風聽九皋唳嗚呼江夏姿竟掩宣尼袂昔者武后朝引用多寵嬖否臧太常議面折二張勢衰俗凛生風排蕩秋旻霽忠貞負寃恨宫闕深旒綴放逐早聨翩低垂困炎厲日斜鵩鳥入魂斷蒼梧帝榮枯走不暇星駕無安税幾分漢庭竹夙擁文侯篲終悲洛陽獄事近小臣斃禍階初負謗易力何深嚌伊昔臨淄亭酒酣託末契重敘東都别朝陰改軒砌論文到崔蘓指盡流水逝近伏盈川雄未甘特進麗是非張相國相扼一危脆争名古豈然鍵揵歘不閉例及吾家詩曠懐掃氛翳慷慨嗣真作自注云甫有和李太守詩咨嗟玉山桂鐘律儼髙懸鯨鯢噴迢逓坡陁青州血蕪没汶陽瘞哀贈竟蕭條恩波延揭厲子孫存一作在如綫舊客舟凝滯君臣尚論兵將帥接燕薊朗詠六公篇自注云桓彦範敬暉崔元暐張柬之袁恕已洎狄相也憂來豁䝉蔽送李邕唐李嶠落日荒郊外風景正凄凄離人席上起征馬路傍嘶别酒傾壺贈行書掩淚題殷勤御溝水從此各東西遺事李邕聞崔顥名虛舎邀之顥至獻書首章曰十五嫁王昌邕叱之曰小兒無禮不與接而去唐書江夏李邕自陳州入計繕録其集詣孫逖託知己之分李北海書當時便多法之北海笑云學我者拙似我者死集評唐六公咏李邕撰余初讀杜子美八哀詩云朗吟六公篇憂來發䝉蔽恨不見其詩晚得石本其文辭髙古一代佳作也趙明誠金石録紏謬賀赦表六首臣某言伏奉某月日制大赦天下至徳純茂鴻私普洽臣聞聖人紹統必建元良王者郊天是崇嚴配伏惟寶應元聖文武皇帝陛下嗣守鴻業光膺駿命奉先思孝誠已達於幽明立嫡以長義仍深於燕翼皇猷允塞墜禮咸甄俯𢎞作解之恩式布惟新之令若乃滌瑕蕩穢雷雨之施也茂時育物天地之仁也薄征弛力政理之源也録功念舊敦勸之方也加以躬儉節用捐珠棄玉執喪者俾從達禮繫獄者咸釋明刑啓進善之門開直言之路徳殷虞夏義掩羲軒凡在宥刑孰不欣悦又臣某言伏奉二月二十四日制書大赦天下徳洋恩溥逺洽邇安億兆欣欣㒺不幸甚臣某誠歡誠喜頓首頓首伏惟陛下體元聖之姿膺出符之運統理萬事建中于人躬大禹之菲薄奉𤣥元之慈儉損巳以益下約身而愛人捐珠玉而不玩斥綺麗而不御事有妨於農業物有害於女工人力所疲上心攸蕩自此罷黜歸於典常若乃投荒禦魅之倫觸網嬰羅之類或炎裔淪屈骨肉相從或囹圄幽囚饋餉不至皆陽和所未煦雨露所罕霑靡不沐浴天波昭覩白日然後表捐軀之烈所以勸忠廣自棄之仁所以敦孝䖍奉寢廟輟玉輿之資惠緩市估發金錢之積異類均懐土之志髙年加挾纊之恩斟酌泉貨之源變通惠利之弊逋債咸已讜直必容如天之湛恩廣矣稽古之能事備矣彼鶉衣之徒鮐背之叟孰不撃中衢之壤共樂於堯年詠太階之符同躋於夀域況臣謬當共理職在撫循欣抃之誠倍萬恒品不任踊悦之至謹遣當州軍事衙前虞候王國清奉表陳賀以聞又臣某言伏見制書大赦天下以今年正月一日改為元和元年者臣聞行慶布和允光於獻嵗履端居始實屬於元正將大有以惠人乃順時而布令法五始之要流恩而降澤統三微之歴觀象而建元正朔所加遐邇忻戴伏惟皇帝陛下大孝嗣業鴻猷啓圖順天地而發生均日月而齊照馴洽飛走煦育生靈既承太宗文武皇帝之耿光禀保夀天皇之嚴訓百神饗徳萬國宅心敷作解之澤布維新之典將致和平蠲京畿之逋債言念水旱薄江淮之征賦開羅網以宥過崇勲秩以賞勞𢎞褒酬之典澤被幽明旌忠烈之臣賞延於代闡庠序以勸學愍耆艾而加禮恩覃有截化洽無垠超溢虞夏掩映軒頊首出千古遐冠百王億萬斯年永荷天禄謬當任用分鎮藩維不獲查赴闕庭親覩盛禮又臣某言伏奉某月日恩制大赦天下一人有慶百度惟新戴天履土㒺不欣抃中賀臣聞天地元功施雨露以育物帝王繼統昇日月以垂曜羣品資始萬方文明伏惟皇帝陛下嗣守鴻業光膺駿命淳化均於四序大徳合於二儀保寧社稷光宅區宇𢎞孝慈以御下崇恭儉以垂休恩覃浹旬事冠今古況乃順時布政乗春導和敷作解之恩宣在宥之典九族既睦四門廣闢而又洗滌幽縶雷雨之施也歸還流竄羅網之釋也移敘貶黜覆載之仁也蠲除逋債政理之源也褒寵勲賢激勸之方也廢金寶之貢有以彰儉徳也搜遺逸之士有以表至公也元勲宿將賞延子孫庶尹卿士榮周存没廣直言之路啓進善之門徳超虞夏道掩軒頊必將平一殊俗發揮大猷億萬斯年永荷天緒臣謬當任用述職藩維不獲奔赴闕庭無任欣躍又臣某言伏奉今月日赦詔自上下下繇衷尊尊㕘天地之大名貴聖文之崇號休氣宛秀瀰漫雲天煙景昭華光融草樹臣誠歡誠踊再舞再蹈者有以副萬國之歡情増九廟之炳靈矣臣聞孝子事父誠奉其色忠臣事君將順其美皆殊外奬情實内殷超邁盈耳之言適㑹因心之義所以然也伏惟陛下道𢎞一徳功盖四時辰象曷以煥其文雷霆無以雄其武固以業振今昔事溢名言雖僉臣子之謀莫䆒圓方之廣所謂塞元命起兆人羣岳騰聲長河變色宜其雷振於地慶蟄户之出幽日飛於天賀霄極之開朗是以神魚載舞祥鳳載鳴況於人靈況於榮位乎徒張三寸之舌不足以談聖猷空捐七尺之軀不足以報明主無任大慶欣抃倍百之至謹遣所部宣徳郎某奉表陳賀以聞又臣某言伏奉七月三日册皇太子詔書大赦天下臣聞元良者宗祀之本枝赦宥者含育之全徳伏惟陛下赫然光大日昇於天嶷然崇髙岳鎮於地萬齡為夀庶物咸春東海注百川之朝北辰列衆星之拱笑龜鶴之將老朝龍鳳之未伸但以禮備儲宫徳刑廣物挺黄沙之罪再荷生成洗白玉之瑕俱承渙汗中外一命錫無戰之勲夀考百年賙不耕之粟莫不抃舞帝極頌歌聖慈萬嵗之聲夷夏合聽九成之樂天地同歡久沐鴻恩竟無上答悦豫之至倍百恒情舊本英華載六表為李邕作後人駁之曰據唐類載兹表在代宗徳宗憲宗時所上而邕天寶初已殁其非邕筆明矣或云是李吉甫作應屬吉甫良是因誌之
