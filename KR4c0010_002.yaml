body:
  text: 李北海集卷二唐李雍撰表賀加天寶尊號表臣雍言伏奉今月日恩制萬方士庶九土軍戎昭洗宸波光被聖渥臣誠歡誠喜載欣載躍頓首頓首死罪死罪臣聞沐雨露者草樹自樂荷陶釣者動植皆春故知則而象之守而行之所謂則天之明立人之極有慶斯大無得而名者也伏惟陛下尊崇聖祖肅恭道教子物天德序位代工惣三五之妙勳統億兆之全業戈甲謐息華戎底平故得真容慶應濳通帝夢寶符靈貺允叶神心加號所以發祥郊天所以昭報大禮盛事光赫旬時作解周仁廓開宇宙天稟褒稱雲紀變名風物光華再馳暉於日月河山保界重賦質於乾坤同一氣之逮初與四時而浸逺天長地久呼萬嵗於太平國泰朝歡舞九韶於聖主臣忝私守郡常荷戴天空馳就日之誠未盡歌雲之慶無任欣躍竦忭之至賀感夢聖祖表臣雍言伏奉今月日制書至德感神通夢聖祖告以莫大之福示以無疆之期上賀國觀下敷人願以抃以躍且舞且歌臣某中賀臣聞百川所歸者謂之大海萬有所仰者謂之聖人今四海獲安聖人致夀臣子之願允塞乾坤之應克諧粵自書籍以來感慶之深福祐之盛未有如斯者也伏惟陛下道用御天德心子物事無事以集休明至明以𤣥悟人天乃接福貺爰臻故得真仙見靈異相昭應言皆合天心證非外將恢𢎞聖慮照自宸衷啓之大年授以元祜麻姑觀海歷嵗彌長王母記桃與時無準則幽明所載宗廟所鍾兆庶子孫百靈齊集知億年之永託沐萬代之延休草樹自榮魚鱉咸若五風異色四氣同和鼓天地之大爐鑄邦家之鴻業八極猶小不足受其禎符萬物每輕不足答其成造恤獄宥死符以再生寵賢達人宴以旬日耆艾衢陌工賈旗亭髙興太平之時歡言上古之化撫家族以自慰詣州邑以相誇官不驕人人不畏吏識天之覆熙焉如春惟聖之慈陶然如醉無任忭躍慶喜之極謹附表陳賀以聞臣雍誠歡誠喜頓首頓首賀新殿鐘鳴表臣雍等言伏見昨宣示於新殿為萬姓祈禱神鐘自鳴是知聖作升聞天意下降道開皇極潤及生人臣等中賀臣聞光覆動植者莫如天臨昭幽遐者莫如日自非齊聖妙用曷以則而象之𤣥化至德曷以感而通之伏惟陛下道心沖叶神教昭宣以四海為家萬人為子常恐水旱遞有干戈暫勞所以供祀百神用祈五福德澤被物聖靈動天睿情注於一時景鐘鳴於别殿夫衆者萬有也廣者四維也今陛下惣萬有一四維濳運方寸之間充塞宇宙之外則何聖不鑒何神不昭豈惟一鐘乎况南面之位屈陛下之至尊西方之金啓陛下之本命非無情之應是有由而來自然羣龍扶持九天欣戴保億兆之元后登千萬之永年時觀雍熙代階仁夀此天所以告鐘所以鳴臣等幸朝上京欣遭大慶一舞一蹈未極臣子之心再詠再歌徒知天地之德無任忭躍之至賀章仇兼瓊克捷表臣雍等言伏見中書門下章仇兼瓊奏稱吐蕃數萬圍逼於城皆遵奏九重決勝萬里臣聞雷之震者可以破山風之威者可以蕩海伏惟陛下允答天地丕應鬼神吸之而百川却流吹之而萬物倒植是以暫勞貔武一掃戎羌髙屋用於建瓴銛戈申於破竹豈云懷縣獨有獲嘉何止絳城復稱聞喜光風動處草樹為之欣榮晴天轉時日月為之融朗況臣等分闕寄切報國身輕蹈舞徘徊恐門庭之地窄詠歌踴躍賀邦家之慶深無任欣說豁快之至謹詣朝堂奉表陳賀以聞淄州刺史謝上表臣某言伏奉某月日恩制除臣淄州刺史以今月日便道至任自逺江左近守河南收弊死灰建置生路别荷成造兼冀升遷三慶集身百齡踰外中謝臣聞天地大德含育及於昆蟲雨露深仁霑霈及於蕭艾不限微品有愧洪爐職今之謂歟伏惟陛下道總三才在璿齊政運超四孟與物為春𤣥造加於萬方聖慈周於一物字人開化議事立權張皇連城勸勉犀嶽身同京職承祿賜之恩榮子預選曹廣門閭之惠澤是以龔黃蓄鋭卓魯専精竭盡公忠𢎞宣績用但駑駘之力不足以騁長衢朽木之資不足以施長桷徒遷厚祿無益聖朝撫事捫躬慙魂局影伏以東臨巨壑借渤澥之水寬西望京師就長安之日近為濠州刺史王弼謝上表臣某言伏奉某月日制除臣濠州刺史聖澤天臨寵章霞燠身微草芥地重丘山臣某中謝臣某奉詔字人星言即路三省不及二過有懷棄短之恩竭力難負悔非之感瀝血未申以某月日到州上訖臣履氷誓心飲水銘骨勵精為政刻意求仁實望昭發宿誠宣揚大化上酬天地之德下盡臣子之忠臣萬死足矣謝賜遊曲江宴表臣雍等言臣聞昔時人君之德也大撫萬國必親諸侯是以通下情序賓禮伏惟陛下因遇上已收接下臣順發生之時𢎞在鎬之宴仙厨和鼎浹洽於廣筵舜瑟歌風均調於曲水士女車騎充溢山川林薄光華纚連城闕臣等撫躬何幸報德無階空慙尸素之名豈適輪轅之用不任載荷抃躍之至謹詣朝堂奉表以聞謝入朝表臣雍言伏奉七月十五日恩敕許臣㑹計京師者止水一杯忽聞朝海枯查八月更得一作覩浮天臣某中謝臣以幽遐必察者日月之照明憔悴皆霑者雨露之恩廣伏惟陛下天德隂隲神功獨斷咸造吹萬容至於工養報通三大及於小豈臣微物得預洪爐在昔全生已承曲記斯今上計再荷特恩戴盆之心仰天有望出籠之鳥飛空可期方將蹈舞闕庭慙戴咫尺葉公宿願一覩真龍岐下遺氓欣逢聖主無任喜躍慙荷之至謝書上考表臣某言伏奉今月日聖恩鑒以薄能光賜上考御詞激物睿奬動時戴天奚勝局地無所臣某中謝臣聞荷再造者遍於有情勸庶工者盡於有位莫不宣其力竭乃誠欣赴前儔恥居後殿者蓋以萬數則區區揚化眇眇納忠自化彭蠡之魚更是海濵之鴈伏惟陛下太和布氣巨壑流津宇宙開明既照纎草山河解潤每納昆蟲豈臣凋枯復霑雨露天漢之上遙記嚴平宣室之中興言賈誼摧羽插翼忽飛翥於雲霄暴鰓揵鰭重游泳於溟渤豈有循吏得預詞林鼷鼠軒墀鶢鶋鐘鼓徒驚奬飾益用慙惶况乎政術空虛褒述纍積文髙日月辰象法之不逮德厚嵩華羣嶽朝之莫階雖郭隗濫觴明主有所蓄意然邵信敦本微臣不敢負人慶抃則深憂懼亦切無所報國空以誓心不任感荷欣惕之至謝敕書及綵綾表二首臣雍言內使左立真至伏奉去年五月二十日御禮慰問并賜綵綾章服跪奉天書勢在龍武仰瞻禮物色映虹電慙戴汗流戰懼心栗臣某中謝臣聞食曰人天實生生之厚道稱物母得存存之多伏惟陛下載以坤輿覆以乾宇排衆口之謗開獨見之明生臣存臣至於數四寵及問及彌於再三豈魯陽霄人景日回照荆樹散木慶雲結隂臣是以坐有所思行冀所得求西山之藥願補聖躬論東户之人以分帝念識愚不足以廣聽事躓不足以動忠夫何望焉非所隱也豈謂塵壤見納推言不遺奬以及誠許以佳士澤深巨海德重崇丘曷云家奉賜書光華九族物延世舊褒寵百齡淥水之龜且能回首黃華之鳥將以誓心惟報主之末由恐殺身之無益不任戴荷欣躍之極謹因內使左立真附表云云又臣某言伏奉去年月日御札特賜臣章服綵綾等八體神變回龍鳯之殊姿五色暈開動雲霞之仙氣臣誠歡誠喜頓首頓首臣聞礎之潤也是足興雲戈之鋒也或能照水雖言微物有以上通常未察焉今可期矣伏惟陛下一武一文廓彌綸之道乃神乃聖疏造化之元盛業極天鴻休紹古子育庶物臣伏百蠻溟渤不波沙朔無障太平之律大聖之功不得巳而用之猶且增髙彌短廣大衆流録賢傾守內之心捨過求天下之俊所以喁喁者將百身以效節區區者願一報以瀝肝况臣拔自九原出於萬死再收骸骨更造衣冠舌在不足以歌堯命存未能以報國豈謂上仁德廣澤利無益之臣博愛理深慈育不才之子天門下詔橫筆陳於長山御府賜衣列錦川於淄水臣道子道何顔受之今恩昔恩曷云報者戴天知重望日懷慚無任悚惕震惶感戴抃躍之極謹昧死遞表陳謝以聞謝賜慰喻表臣某言伏奉今年某月日恩㫖恕臣重責護臣小才日月之明早曜絲髮雷雨之施振起昆蟲臣某中謝臣二十餘年數從逺謫流離辛苦契濶死生因陛下興聖謀行天討救萬人之命解四海之懸臣所以脫於往危保於今泰者為此頃嵗昌宗執柄三思弄權臣與宋璟同論桓敬俱奏貶臣為常州司户實荷陛下誅韋氏之後收正人之餘特拜臣左臺侍御史此陛下活臣之命貸臣之榮一也頃嵗譙王重福謀立東都臣當留臺與洛州司户崔日知挫其逆謀收其餘孽東都底定職臣之功自文林郎拜朝散大夫除户部員外郎岑曦崔湜之輩以臣再用往還并忌崔隱甫倪若水等恐為陛下之助與臣同制各貶官仍聨翩左遷為崖州舍城縣丞及陛下正位紫宸臣又自嶺南九品逺惡官除朝散大夫户部郎中又荷陛下活臣之命貸臣之榮二也頃嵗陛下東封將還臣路左謁見猥承聖顧廣録舊文朝議恐陛下用臣薛自勤與外生厙狄履溫羅織臣至死仍承陛下免其罪授臣官又荷陛下活臣之命貸臣之榮三也臣出入嶺南自經一紀自澧州司馬加朝散大夫兼此州牧解青綬垂彤襜去瘴毒之艱遂江山之性又荷陛下活臣之命貸臣之榮四也且臣逺覽前書頗聞故事一食之惠尚可殺身況臣䝉聖主千年之恩救愚臣萬死之急至若訓誨委積率喻再三蚊力負山不勝其重螢火向日徒失其晶必當閉户絶交澄心去欲下以安所部上以報所天豈徒殞軀喪元焚妻夷族而已無任生死骨肉恐懼感戴之至辭官歸滑州表臣雍言臣素無藝能積負訕謗衆多之口自可銷金怨讐之心每堪殞首伏惟陛下至明大聖察之纎微盛德在人洗之瑕穢山川納者不擇薰蕕天地覆之是霑雨露且人荷惠渥大抵官榮今臣䝉國恩私及軀命事出涯分之外恩加父母之深已逝之魂復歸朽質既乏安地尚忝髙班雖欲殺身未能報主彌慙持祿有以保名但秋燕將辭必徘徊於大厦老馬雖去終顧步於華軒況臣今兹六十有七光隂荏苒行止欹危就木之時不知幾日懸車之嵗僅有三年即以今日歸州不任違逺涕戀之極謹奉表以聞進喜雪詩表臣雍言一昨瑞雪愆期農人阻望陛下以億兆勤慮倉廩貽憂禋祀𤣥冥祈禱黑帝固能至誠應物聖德動天朔雪下於龍山海神朝於鳳闕是以途歌邑舞野慶朝歡荷一人之渥恩為四海之膏澤臣仰思揚化伏念輔時雖力減鴻毛而情殷鶴立無任喜躍慶賀之至謹昧死詣金闕門陳表貢詩一章臣雍誠惶誠恐進文馬表臣雍言聞禽獸殊祥卉木奇狀自古著也必有應焉伏惟陛下德合天地道通神明天物所以來神物所以見且麟者仁獸主仁者則呈馬者文身君文者即降曾是上叶尊號下報太平也觀夫豹蔚騰文龍章助聖書籍所未載耳目所未聞即知非常之君必有非常之物臣不勝忭躍欣慶之至謹遣某官馳表奉進以聞疏諌鄭普思以方技得幸疏蓋人有感一餐之惠殞七尺之身況臣為陛下官受陛下祿而目有所見口不言之是負恩矣自陛下親政日近復在九重所以未聞在外羣下竊議道路籍籍皆云普思多行詭惑妄說妖祥唯陛下不知尚見驅使此道若行必撓亂朝政臣至愚至賤不敢以胸臆對揚天威請以古事為明證孔丘云詩三百一言以蔽之曰思無邪陛下今若以普思有竒術可致長生久視之道則爽鳩氏久應得之永有天下非陛下今日可得而求若以普思可致仙方則秦皇漢武久應得之永有天下亦非陛下今日可得而求若以普思可致佛法則漢明梁武久應得之永有天下亦非陛下今日可得而求若以普思可致鬼道則墨翟于寶各獻於至尊矣而二主得之永有天下亦非陛下今日可得而求此皆事涉虛妄厯代無效臣愚不願陛下復行之於明時唯堯舜二帝自古稱聖臣觀所得故在人事敦睦九族平章百姓不聞以鬼神之道聽天理下伏願陛下察之則天下幸甚狀謝恩命遣髙將軍出餞狀右髙力士奉宣口敕以臣臨政特令賜宴恭承惠渥伏念庸微天地周仁木石知感不勝惶悚戴荷之極臣死罪死罪臣歷覩自古君臣凡所際㑹或因緣黨進或收接功成故未謁而知不言而信豈有地孤援寡毁衆謗深察蒙蔽之中致昭曠之外逢陛下特達之遇當陛下明聖之朝事出嘗均恩重今昔誓將瀝血足可竭誠徒欲殺身豈能報德至如勵精勤政舉直徇公副陛下憂人之心行陛下𢎞道之化豈敢失墜以負神明但函關路懸長安日逺不任戀主慺慺之至李北海集卷二
