body:
  text: 李北海集卷四唐李雍撰碑大相國寺碑夫聖不徒作作必有因化不徒開開必有攝故大事所會一法所傳若天若人或賢或達雖萬牙出地而三獸渡河使不聞者聞未悟者悟豈虛也哉此寺伽藍古廢建國有濮州之像自安業而來及逝將復歸堅守常住人至萬且千飛聲殷雷用壯敵國坐如清泰安如須彌有若部人郭賓者生心起謗雙目失明有若部人陳振者興言誑徒喉腫及舌皆追悔自昔痊平在今或沒身為奴或鑄鐘依佛延和初載奉詔改為大相國寺復置額焉先天中內府降財御書題額睿宗通夢靈應肇發臨遣碩德僧真諦載馳載驅乃慰乃止昭宣渥命寵錫神幡吏人候迎法侣圍繞豁㕓里羅郊原者不可勝計夫以金仙聖容之表先主感之代邸嘉名之舊先主摽之筆精池水之妙先主躬之故能鍾乾坤激日月景光遐燭德宇𢎞覆曷云比也我開元神武皇帝受天元禧祚國傳寶睦九族叶萬邦功濟而業成道光而孝理惠康父子義結華戎寰瀛之濱大輿之上顒顒而戴欣欣而懷逮識路于兹寓目于兹者莫不瞻大明欽聖禮仰天性而泣遺澤荷慈氏而歎堅林形力者罔告勞檀施者罔辭費莊嚴不獨於示相功德何止於無為碁布黃金圖擬碧絡雲廓八景雨散四花國土威神塔廟崇麗此其極也雖五香紫府大息芳馨千燈赤城永懷昭灼人門天上物外異鄉固可得而言也上座知隱寺主元深都維那上智儼皆妙覺圓常對境亡境彌入後地因如得如合之不離混以相濟咸以為他方所至廣法界惟三虛空所至𢎞度門惟一况乎實相感通之應聖迹飛動之神安可默頌聲闕題紀者巳乃作頌曰佛法住持正教𢎞益真容見寺先帝書額藩邸鴻名建國前迹我皇孝理我人光澤日月明明家邦赫赫觀妙追逺懷恩惟昔八部莊嚴四天感激以式永代是紀豐石大雲寺禪院碑天也地也攝生之謂玄造日也月也容光之謂神功然亭育之仁可斡終滅昭明之力未焯昏霾故熱惱積薪劫燒難鑠驚波巨海沃焦自淵獨有導師空王禪那宴寂一念首安住之域加行證無為之階密教內修莊嚴外度雙引相應並照兩忘然後生無生淨名不去照無照了義能覺爇菩提之炬則枳棘滌除楫般若之航則橫流既濟湛四體於中道超三有以上征精舍攸隮度門斯盛其此之謂矣粵自有寺之艮背山之前臨有確師禪房者武德八年邦守蕭公諱顗護法之所建也周目環郭澄心際海亦既一味實無衆生夫憑其髙宅其勝曽近俗諦或乘法流且水出於冰凡作於聖雖曰醜地猶是道場矧乃妙有孤標寶相靈變入我室觀我形者哉施及貞觀嵗有等觀禪師繼前心承後問分之則别位二事合之則同列大空坐於斯竟於斯嗚戲四益風驅百為大滅棟宇崩落象設傾低先天中有慧藏禪師聞之斯行居而不住妙齡強植徑節老成被甲律儀下帷經藏方丈之室時歷十年簞瓢之餐日常一食信為法本悟實如宗簡珠圓明紅蓮清淨剃髮結落亡境受除生起了於身緣覺被於物是以興補舊塔建置尊容彌陀當其陽菩薩侍其側四大海水慧眼啓明五須彌山毫相崇絶有若稽義托實沿名討因都極樂之大郊夀無量之景命借如昔者稱贊觀厥音聲克濟斯艱乃復於逺則有階地超越自在神通發𢎞願心得大勢用皆所以濡火宅軔劔輪投地者結業坐開入影者苦趣以息粵若殫財竭力刻桷雕題積三四年模造化意寶殿蔚以雲構金山煥其日臨豈徒然哉夫壯麗者將以重威神儀形者將以攝歸止或離性解脫或見作隨緣藥草寓其根莖雲雷感其方類即説非説若通不通惟三獸之渡河庶一子之來學禪師以為默則絶教言則牽文茍心事於化人豈迹留於捨法會議斫石僉允圓功雍來守是邦偶聞兹事依僧依佛何日忘之在家出家惟其常矣頃者下檄湖海申明捕殺鱗羽咸若災疫以寧救蟻雖尚於沙彌涸魚每憂於釋種祁寒則怨童子何知率三省於短懷寄一塵於寶地别駕𢎞農楊公守堅字越石本支鼎貴胄胤嶽靈直道守公智印觀法司馬琅邪王公元朂字固禮髙闈襲吉皇士令名資位升聞妙意融朗盛矣美矣左之右之時有新羅通禪師五力上乘一門深入利行攝俗德水浮天贊而演成恭而有述其詞曰覆燾之奬始生終滅昭回之明內昏外徹陰入不斷心起難折靈海欲深洪爐火爇倬彼大師超然正覺亡境息想示法流渥絶生死岸破煩惱殼度門光啓住地玄邈傳燈三葉分座一義象設儀形莊嚴地位有為不染無相能離茍曰法乘莫非種智古者豐石抗之髙山紀事標社銘勳列班廣兹妙有運彼玄關則百伊昔粵吾無間鄭州大雲寺碑恭惟黃屋者異唐堯之大雅精舍者曷釋迦之廣乘將以示崇髙𢎞誘進俾夫壯麗加於四海瞻仰攝於羣情酌言永圖即理一貫矣大雲寺者鄭國慈緣之所建也觀其肇允枚卜爰適底居所感彌多光靈滋茂固以星晷上憲人統下稽執天物之大中合玄宫之妙相豈止宅豐壤盤名州厦屋雲陰沙門玉立而巳於是象設巨麗法供魁殊尊容乃神靈眷所仗則有寶座蓮動現身金光不同於凡復歸於靜至使彌留咸華逺人孔殷香饌比肩花蓋擊轂一心不起則從願應如二見無物則隨施逾疾故能飛名勝出福履嘉祥昭升纍朝發宏歷聖粵髙祖神堯皇帝俟時登庸縱觀興感再駕尚軔五轉欲承鳳集矞雲龍睇霄極馳睿想於幽贊禱法力於大雄創建漆象一軀植淨根也洎我髙宗天皇大帝纘祖匡業繼明德暉萬流澄瀛八風叶律齊致功於造化將有事於岱宗道繇是邦言念兹者寺中留繡像一禎實也下厥則天皇太后奉遺托孤與權改物母儀霸迹閫政神器追惟乾蔭永動皇情明啓度門宣遊覺路乃降繡像一鋪廣也借如崇建塔宇附麗朝闕憑縣官之力散王府之財中使相望匠人經始則有之矣未或介在草澤僻居里閭發皇明於日中落寵錫於天上有如此之盛者也日者通莊載堙繚垣式遏門途弗敞面勢匪宏浮雲在天蝦蟆蝕月具瞻者渴髙明之嘆歸止者憤翳鬱之心寺主俗姓李氏名婆諦隴西姑臧人也發趣如因彌入禪寂雖獨得斷相而同人有為乃陳詣府庭移牒省闥引仍舊之直矯易恆之枉申報曠祀奔走宣勞終於訟真成我道勝是以頽墻埧塹焚萊平場廣途褰開曽構踴出疑若當陽豁若捷徑洛師之道蕩胸泠然決渠縈波之水所謂形便得莊嚴具行李榮觀郡邑景矣長史河東栁沖府君道融至和性與元德從心絲譜遊刃翰林推轂演成誓言同事是刋厥懿豈伐於功其詞曰鄭之法宇兮在城一隅大雄應感兮休徵有殊纍聖克念兮象設三鋪佛身圓對兮神光發圗乃奉靈勝兮至自彼都面勢推隔兮頽垣朽株南望不及兮鬱然坐拘觀者佇眙兮願履夷途碩德感發兮執心匪渝豈用歷紀兮兹事乃敷刻石傳懿兮表此亨衢楚州淮陰縣婆羅樹碑觀厥好德存樹愛人及烏有情不忘雖小可作此施及者也則有宗廟加敬墟墓增悲覩物可懷比事斯廣此觸類者也矧乃通感靈變玄符聖迹根柢淨土碩茂佛時燭金山之祕影聨玉毫之殊相至若渥日法會茶毗應身妙有雙樹之間光覆僧祇之衆安可混曜散木比列清林議上茅之挺生喻堅固之神造者也婆羅樹者非中夏物土所宜有者巳婆婆十畝映蔚千人密幄足以綴飛颷髙蓋足以轉流景惡禽翔而不集好鳥止而不巢有以多矣然深識者雖徘徊仰止而莫知冥識博物者雖沈吟引稱而莫辨嘉名華葉自竒榮枯常異隨所方面頗徵靈應東瘁則青郊苦而嵗不稔西茂則白藏泰而秋有成惟南匪他自北嘗爾或季春肇發或仲夏萌生早光豐隨晚暮儉若且稿莖後吐芬條前秀差池旬日奄忽齊同無今昔可殊非物理所測古老多怪時俗每驚巫者占於鬼謀議者感於神樹證聖載有三藏義淨還自西域逮兹中休宿因依齊戒瞻歎演夫本處徵之舊聞原其始也榮灼道成之際究其末也摧藏薪盡之餘或森列四方或合併二體常青不壞應現分榮變白有終示滅同盡昔與釋迦蔭首今為羣生立緣夫佛病從人大慈感故樹萎因物深悲理然化能分身半枯即是以有合相後茂還齊宜其表正聖神靈貺品彚以變見一攝而稱讚十方者也淮陰縣者江海通津淮楚巨防彌越走蜀會閩驛吳七發枚乘之邱三傑楚王之窟勝引飛轡商旅接艫每至同雲冒山終風振壑宦子惕息篙工疚懷魚貫迤其萬艘霧集坌於層渚莫不膜拜圍繞焚香護持復悔多尤回祈景福於是風水相借物色同和挂帆啓行方舳駿邁浮山崛起而疏巘慶雲亂飛而比峰雖電影施鞭夸父杖䇿罔可喻其神速曷云狀其豁快者哉州牧宗子名仲康廣孝惟家大忠刑國播清政以主郡議古式以任人知微知彰有禮有樂别駕扶風竇公名誡盈盛門貴仕懿德令名利用以厚生明略以營道上交不諂下交不瀆司馬宗子名曰景虛受賢交幹用柔克退遂中律先後自公且觀麟趾之詩未𢎞驥子之任邑宰清河張公名松質藐自稚節忽乎博聞始於能賦而彰中於成器而立牧人通志徇物合權威肅攝於神明慈惠安其父母豈伊政理自有才名莫不淨慮一乘追攀八樹歎從植而多感惟化生而永懷大啓上緣率心檀施碩德徐道暉寺主道玄上座道約都維那曇一等皆妙覺圓常釋門上首痛金棺而既往駭堅林而在兹鄉望司徒玄簡戴玄景王玄圭張仁藝王懷儼劉元隱沈信祥等夙悟大師深入真際勤行進力護供莊嚴揚州東大雲寺法師希玄廣派清流固植德本戒行有以鎮浮俗利言有以誨蒙求既憑藉於衆心亦謀明於獨得是標靈迹乃建豐碑其詞曰政化之理兮甘棠猶存寶乘之妙兮婆羅是敦欽厥道成兮八相克尊感乎示迹兮一歸可捫與佛合緣兮榮落同時歘爾化生兮感變誰思休徵咎徵兮伺察不欺流俗莫識兮綿曠驚疑上人西還兮覯止增悲發皇靈貺兮堅固在兹方國傳聞兮想像悽其回首正信兮頂禮護持優曇千年兮曷足儀之銘越州華嚴寺鐘銘并序有同乎源播厥派者夥哉沿之惟輪則終列大輅革以穴處則崇構厦屋譯梵言於華學象楗槌於景鐘從來久矣觀其聆妙音奬𢎞誓文苦趣警禪門劒輪在空法衆斯集鏞之時義大矣哉郡司冦北平楊公沙門師萌抵淨根保耳界妙有忠為迦維之業堅朴象正之鈞嘗慨靈越樂郊勾吳通邑雖經行大壯塔廟藝釋訓乃首唱羣吏傳聞庶氓合聽悉心聚糧殫幣鑠文馬以庀製驤羣龍以範鐘撰祥時歷令日傾郛鄙畢緇黃舉帆雲屯擊轂雷動百身勇施纍讚願言者計以萬億然後陶人事爐火正疏冶風伯鼓槖樂工揚嬉煥乎鼎陳蔚焉邱峙手舞者翳景稱慶者振林遲明藏功亭午卒業於是層臺大起雕􅒶懸列鯨魚吒怒以震擊蒲牢跧曲以駭噭隱天網謍地理剎那昭應一念信心有無識生幽執鬼物莫不休復淨域貞觀真諦矣有若大者不槬小者不窕則州鳩之聽曷以臻其間歟其詞曰大雄立號兮考彼華鐘震發三界兮以覺其聾俾我羣動兮不罹厥凶君子是象兮載鑠載鎔彌億斯年兮罔有天鏞記石室記髙要郡北十五里有石室詭怪萬狀崆洞其中發揮靈蹤盤薄厚地皆神仙之窟宅為區粵之勝概或有巨石皆似蹲獸之顧疊花仰空的皪瓊脂色如截肪矣傍引穴竅疑為洞門橫聳石牀方次仙座西廂峭壁下有涵泉漲澄鏡色味輕瑶漿東西倚山之陽二十餘里西通武林東扺靈羊峽時開元十五年之春正月二十五日右遷陳州刺史李雍記李北海集卷四
