body:
  text: 李北海集卷六唐李雍撰神道碑贈安州都督王仁忠神道碑觀厥君子大司莫盛於禮樂時事大竇莫及於寵榮非夫周於財厚於行外無鬼怨內無人非將何以享而福之兼而有之寅亮邦家武衛帝室者也府君諱仁忠字揖太原祁人也其先系於有周氏於子晉文武不墜子孫其昌掌兵霸秦為相寧漢纍葉交映兩朝相輝梁之孤鳴司徒匡復於將亂周之龍躍開府扶翼於巳興曾祖景孝府君隋屯田侍郎祖詮府君皇朝明威將軍歙縣開國男汾州刺史考文濟府君侍郎御史吏部員外朝散大夫東臺舍人並典學懿文夷道全德髙舉時秀丕承國琛府君至和有純上德膺茂軌度恬簡品鍳朗拔篤誠博達英邁竒偉詩書異等容貌出徒飄然清風藹然皓氣安步名教詠歌典墳虛心以遊不思而得至於緝熙逺略繩準嘉言寶匣干將玉臺明鏡未云此也解褐濮州司法參軍要囚有倫亂獄不作泣下丹筆情深赭衣俄轉湖州司兵參軍郵亭利權豪富僦市脂膏不踐玉帛何階頃開元皇帝之潛春闈也以府君后之季父時之正人吳札識音周瑜能聽遷太常主簿尋以地近姻戚望出衣冠仍加朝散大夫試本寺丞屬國家有事上𤣥張皇大禮沿革舊典節制新儀超上柱國而即真焉及皇上御極元妃升后遷太子僕六馬肅若其僚仰止朱袚皇皇鳴佩載遷鴻臚少卿四極梯航萬酋匍匐且和戎狄未繫單于轉太常少卿九樂備陳三禮大舉觀諸侯之㑹知天子之尊除左千牛衛將軍晝巡蓋常夜拜是功上謂府君曰昔太上皇嘗居此職時相委任是屬親賢府君兢懼滿盈誠懇辭避鴻私屢抑嘉願莫從霧露不宣腠理成疹詔使旁午御醫崩奔嗚呼杲日或虧良嵗多謝命莫能續天將謂何春秋六十有一以開元十年三月癸酉朔捐館宇於京兆興寧里之私第皇帝震悼椒宫感惻制贈安州都督賜物二百匹米粟二百石喪葬官供加𤣥纁束帛敕萬年縣令韋令監護即以某年八月壬寅朔安厝左翊太原舊塋禮也長子右衛長史嶷次子尚衣奉御嵩司農主簿崑京兆府參軍崇岧屴崿等並昭奬光訓憲矩令猷文翰發於國華禮則隱於人紀追惟廣孝永言孔亟摧心陵谷泣血松楸是用合謀有成作為不朽直書盛德曲訪小才錫類每深注情彌極文章莫及覽對何言其詞曰千年流慶百代象賢山邱藏澤海水成田文武震耀冠蓋蟬聨業揚史竹名雄鼎鉉其一施及時英駿發后族體大志𢎞氣和德淑秀舉清流髙標雅俗地位雙升才名兩復其二太常禮樂儲宫調護屬國風偃司戎山固先帝昔官聖恩今喻匪親曷保惟貞是附其三三旌未涉六疾爰臻擁福何崇轉禍無神喪葬公備哀榮禮陳寵加黃壤贈及朱輪其四松柏舊塋𤣥纁今飾詔使頻繁椒宫慘惻河山動容風雲變色兹焉永懷古之遺直其五光有𦙍子克荷良弓臣孝家節文章代工推心匍匐泣血無窮托碑板以題述庶哀敬而永終其六長安縣尉贈隴州刺史王府君神道碑雍聞才不必用慶有必鍾盡滯或牽於時首正終㑹於古故志氣也不謀於食而謀於道生祿也不在其身即在其子始終備致後起追褒謀翼孔彰前循邁種互體相發他日同時哀榮大來幽明通感長河一曲所以端其濬源髙山四成所以極其層阜粵未可測巳府君諱行果字某太原晉陽人也其先柢於嚳稷幹於季文枝於剪離條於吉駿代關純史朝弗曠官自古及今令名不去六代祖睿後魏尚書令封中山王贈太宰諡曰宣五代祖襲吏部尚書嗣中山王諡曰惠髙祖欣散騎常侍北肆州刺史諡曰穆曽祖子景徐州别駕北豫州司馬祖元季府君屬隋政分崩賢人伏匿誓言避地執心葆光迫以族弟本州逺慮物義辟大中正開府儀同三司考有方府君皇朝岷州刺史皆寵義從禮尊仁依信增業以行道兼濟以守官府君間氣茂靈上德純粹風度簡曠神清秀接衣冠禮樂超等出徒博達聰明舉衆敵國無成足乎多藝不器非其一名讀聖人之書閲上將之略每及忠公大節孝友至情太息户庭垂涕枕席憮然有開物致君之意立德顯親之心皇士目之通才許之好人方從田蘇之遊巳慕藺生之義至於手畫耳聽口誦目數覆碑背局答難詩賦公每屑焉人所服者弱冠以方聞授閏州司兵參軍事自頃上官侈求同家侵欲或專咨儉嗇或懷其安荒一覯禮容載敷先訓不俟憲矩若對神明信所謂正刺邪德形物至於此也未幾宅岷州府君憂七日絶漿三年廬墓泣變青柏祥臻素烏野老明徵邦牧表異府君泣面而視瀝肝而言曰所不死者恐貽慈母痛悼豈願居單外買聲名叩頭止之服除宋州司户參軍日者浦無水虎土為凶年奸吏舞文詭隨畢賦誅求公聚作為賙恤者習為常焉府君位其農郊什其居室正之以法紏之以詞勿言寬征足革舊染議者以為平宰社肉武習宫人一葉知秋百為有典矣總章嵗句麗負海欺天國家泛舟討罰御急宣之明命濟懸軍之見糧董其轉輸舉於幹職是役也繄公遷長安尉無何丁太夫人艱禮異於經毁甚於昔且二尊孝等偏罰事殊往顧慈親今極真性臨穴號呌仰天殞絶嗚呼孝歟春秋三十有七夫經德而夭代人所悲執喪而滅錫類所痛有一於此則可以束名教感人倫况兼而極乎夫人中山甄氏父雍州豐崇府左别將黃陂縣開國男食邑三百户行府君之息女嬪有令言母有彛則從夫德貴訓子業崇力遷於山祔同於穴粵以景龍三年嵗次已酉十一月庚寅朔十三日壬寅合葬於洛陽清風鄉之原禮也長子晙慷慨英達激揚忠孝誦習文思昭宣幹略元宰經國上將視師申通明之偉才竭寅亮之誠節其志如石其心如丹五間三連少籍多得空始無所逞其計合散無所用其鋒李牧十年武侯七縱盡兵聲於河外揚主威於海濱三士列其多備九原襲其光寵開元十一年九月八日制曰存樹其名沒而不朽緬惟褒飾𢎞是典章贈兵部尚書同中書門下三品上柱國行果粹靈誕和敏德成器髙節夙著盛名有歸雅志未伸促齡永謝象賢之美不展於亨衢而積善之徵克崇於後嗣嵗紀方邈徽猷自逺宜申寵贈使持節隴州諸軍事隴州刺史勳如故次子曔故邠州永夀宰神和體正經明行修有甪無齒惟天之道與才不夀匪身之辜兄也孔懷緬然增感願述光德克贊豐碑髙燥有以壯孝心樵蘇有以敬賢墓其詞曰德不孤慶有績迹時晦賢必復名實才尊匪祿博技藝窮簡竹耳暫聞心以蓄手未止目猶逐碑可背奕能覆坐嘯委行道朂孝深至滅太蹙奬教義揚雅俗位嘗卑齡雖促推仁信致戩穀鍾令子發華族振武旃廣文牘經廟堂掃邊服昭皇考贈丹轂臣道著子道足哀且榮幽既燭考罔已性相屬碑乃建神所福桂州長史程府君神道碑觀厥品目異等業尚獻臣天與才名神福夀考而中留官序小往代艱位不極乎多能績未宣其利用戢駿翮韜良工悲聲起於絶絃泣涕形於抱玉自傷楚老豈獨公明而已哉公諱某字某廣宗新安人也其先出自顓頊重黎之後周之休父入為司馬漢之不識擢居衛尉至若昱輔魏主嬰立趙孤奉日以納忠殺身以明節精誠發於寤寐義烈冠於人倫宜其貽謀克家寵光形圖業與時並名與功諧者也五代祖響府君陳襲重安侯隋蕭縣宰四代祖育府君隋車騎將軍曽祖皆府君隋涿郡主簿大父𢎞府君皇朝安陽令考大辨府君泗水六合二縣宰撰東征記兩卷藏之祕省莫不託宿元德從事老成典學積於蓬山能賦秀於詞苑府君令始家則光有國庠博通全經悉數賢行孝曰曾子文似相如下筆不休遣言無擇陳平長者把臂每多田蘇好仁引繩相重解褐徐城尉始足下也旋應五臣升弟遷宋城轉櫟城簿王畿政重帝告事先握札雲飛聽訟風靡載擢來庭長安二赤縣尉樽銜御黠夙駕承天驚暗若神應封猶響籍聽擢左臺監察御史仁克寬仁無害恥為誶刻雅欲優閒朝廷許之轉詹事府司直歷城直厯城門郎長杜武進朝邑曲沃好疇雲陽宰六縣皆代工開化順時布和慎簡里胥周省條簿其清水鑑其坦砥平從心術以外形隨手妙以旁發人樂新政俗勸古風載遷魏州司馬靜守憲矩審喻宷寮官師有章人吏不黷屬右族黜免徹嗣姻連奏引諫書醜詆宰輔選其頗正其奸贓士寒心明家質首左遷府君饒州焉謫子昕崖州舍城尉俄轉府君桂府洎島夷干誅天師問罪憑險毒送死阻兵昕乃不俟檄徵自促鋭陳挺身而當矢石抆面而覆冦讎馬旋泥中人走巖下憤氣雖作救兵莫臨劍交於胸戈達於腋其命則殞其目不瞑嗚呼爭首謂忠供養謂勇倉卒歸盡零落無成有感路人愍悼慈父沈悲生疾積痛傷年猿堪斷腸烏可銜木人非命也天何問焉以開元十六年五月奄徂化於官舍以某年月日反葬於某原舊塋禮也夫人廣宗潘氏封某縣君即銀州刺史寶績之息女柔慈孔嘉貞淑丕訓是佐君子宜偕永年桃李早零柏松同祔子皓曜曦等並才彥惟有名教克閒優游翰墨之場造次仁義之域宅憂殆滅追孝有望匍匐昭親哀迷紀石雍以披顔友道列坐詞人談笑未終存殁相訣情也有慟涕之無從雖不工於文將達其義詞曰曾源積兮流瀰長髙闈慶兮齡亦康命不泰兮時未將何寵祿之中否從政理之孔臧坐疏屬之嬰纍重愛子之飛章遭一門兮二謫備周嵗兮兩喪寄永懷兮身後惟沒代兮名揚墓志銘羽林大將軍臧公墓志銘夫纒兵者㝢內所苦用武者朔漠所懸粵若董戎三軍司帥萬里未易為也是以纍戰必勝所謂興國每守必固所謂扞邊英雄歟忠公歟不然曷以分命山河書勳竹帛者也公諱某字某莒人也其先周公之祚𦙍自僖伯哀伯正詞魯史太傅太守埋迹漢朝克揚厥休不泯於代所從來逺矣公即隋銀青光祿大夫海州總管上柱國東海公府君之曾孫皇朝請大夫靈州長史上柱國襲東海公寵府君之孫皇朝散大夫原州司馬贈銀州刺史上柱國德府君之子少而習書長而事武特禀間氣雅持大名暗合孫吳自比管樂移家共國出孝垂貞公用仁足以子人崇義足以開物弱冠應穿葉附枝舉擢第授長上再遷果毅都尉三除郎將加銀青光祿大夫蒞歷單于安北靈勝洮鄯安東七州都督護擁麾豐安河源莫門朔方朔州平虞六軍經略節度營田大使三入羽林大將軍加冠軍大將軍上蔡縣開國公至若設竒兵勦勍敵智出人境事揚天聲經始三邊倐忽四紀舉無遺䇿動有成功雖李牧十年武侯五月罔足以議及乎握禁旅直嚴更遏周墻之禍萌增鈇障之安國又何加焉自頃卧疾時扶力强飯嘗以胸奴未滅家國所讎長吟朔風太息秋序嗚呼陵谷者地之險有時而遷日月者天之光有時而異况於人乎風瘵彌留以開元十七年八月二十二日薨於平康里之私第時春秋六十有八親友揮淚朝廷嘆息逝川歸海長城復隍悲夫以明年七月卜地於白鹿原禮也嗣子定逺將軍前左驍衛翊府左郎將兼撿挍左監門衛中郎將上柱國敬亷次子中大夫前安北都尉上柱國希莊三子前左金吾衛中侯賜紫金魚袋上柱國敬之四子前左司禦率府長史賜紫金魚袋內供奉上柱國奉忠五子前殿中省進馬上柱國敬泚等並棘風茹荼薤露泣柏號天自􅧆負土空寃用紀石銘將符竹簡自承訪舊逺託馳誠事梗概於豐碑情辛勤於絶筆其詞曰周公錫𦙍魯國因名矢魚興諌納鼎飛聲家傳禮樂代有賢英才子間出武功特興提兵北壘救敗西鄙保界七州彌曠四紀無堅不陷無强不却三邊風清萬里雲廓謀慮縱橫威名昭灼物莫能久運何以長邊也不幸人之云亡風沙未息松柏巳行哀哀孝思冥冥泉壤髙山或遷其詞爰仰庶石銘之可託或蒿里之無爽李北海集卷六
